name: Terraform Module CI
on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    permissions:
      contents: write
      checks: write
      security-events: write
    uses: Diehlabs/shared-workflows/.github/workflows/terraform-module.yml@0dad30a300167504c240e28f9495d9aba525651c # v0.2.15
    with:
      # terratest creates a real AKS cluster and needs Azure credentials
      terratest: false
    secrets: inherit
